name: Android CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Run unit tests
        run: ./gradlew test --stacktrace --console=plain

      - name: Verify performance modules compile
        run: ./gradlew :baselineprofile:assembleBenchmarkRelease :benchmark:assembleDebug --stacktrace --console=plain
